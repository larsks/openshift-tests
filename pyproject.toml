[project]
name = "openshift-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.5",
    "jsonpath-ng>=1.7.0",
    "kubernetes>=32.0.0",
    "pytest>=8.3.4",
    "pytest-xdist>=3.6.1",
    "pyyaml>=6.0.2",
    "xmltodict>=0.14.2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--tb=line -v --junitxml=testresults.xml -W 'ignore:record_property is incompatible with junit_family:pytest.PytestWarning'"
