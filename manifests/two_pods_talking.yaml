apiVersion: v1
kind: Service
metadata:
  labels:
    app: pod_with_service
  name: "test-service-{{ testid }}"
spec:
  ports:
  - port: 8080
    targetPort: http
  selector:
    app: pod_with_service
    testid: "{{ testid }}"
    component: server
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: pod_with_service
    component: server
  name: "test-pod1-{{ testid }}"
spec:
  containers:
  - image: "{{ testimage }}"
    name: test-container
    ports:
    - containerPort: 8080
      name: http
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: pod_with_service
  name: "test-pod2-{{ testid }}"
spec:
  containers:
  - image: "{{ testimage }}"
    name: test-container
    readinessProbe:
      exec:
        command:
        - curl
        - -Ssf
        - "http://test-service-{{ testid }}:8080"
      initialDelaySeconds: 5
      periodSeconds: 1

