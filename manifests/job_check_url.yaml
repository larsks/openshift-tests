apiVersion: batch/v1
kind: Job
metadata:
  name: "test-job-{{testid}}"
  labels:
{% filter indent(4) %}
{% include "common_labels.yaml" %}
{% endfilter %}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
{% filter indent(8) %}
{% include "common_labels.yaml" %}
{% endfilter %}
    spec:
      restartPolicy: Never
      containers:
      - image: "{{ testimage }}"
        imagePullPolicy: Always
        name: test-container
        command:
          - curl
          - -Ssf
          - -o
          - /dev/null
          - -w
          - '%{http_code}\n'
          - "{{ url|default('https://www.goiogle.com') }}"
